<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarForge Strike</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0e14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      user-select: none;
      color: #e8f4ff;
      text-shadow: 0 0 8px rgba(0, 200, 255, 0.6);
    }

    #hud-score {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 14px;
      background: rgba(10, 14, 20, 0.7);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    #hud-score .label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #7fb8d9;
    }

    #score-value {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    #loading-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      color: #a0c8e8;
      font-size: 18px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(0, 200, 255, 0.8);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="hud">
    <div id="hud-score">
      <span class="label">SCORE</span>
      <span id="score-value">0</span>
    </div>
  </div>

  <div id="loading-message">INITIALIZING...</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
